version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/backend", "/frontend"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major jumps need manual migration work (Mantine 6->9, Prisma 7, Nest 12).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
